name: Publish knowledge review

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-review-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Validate the standalone review page
        shell: python
        run: |
          import json
          from pathlib import Path
          html = Path("docs/index.html").read_text(encoding="utf-8")
          assert "__CARDS__" not in html
          assert "wikiReview.v1" in html
          cards = json.JSONDecoder().raw_decode(html.split("const CARDS = ", 1)[1])[0]
          assert len(cards) > 0
          assert len({card["id"] for card in cards}) == len(cards)
          assert all(card["title"] and card["summary"] for card in cards)
          print("Validated", len(cards), "unique concept cards")
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the static website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
