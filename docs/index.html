<title>知识复习台 · 读后回顾与概念摘要</title>
<style>
:root{
  --bg:#0f1115; --bg2:#161a21; --panel:#1b2028; --panel2:#212836;
  --line:#2a3242; --line2:#374357;
  --tx:#e8ecf3; --tx2:#a6b0c0; --tx3:#6e7a8c;
  --gold:#d9a54c; --green:#4fb783; --red:#e05a5a; --blue:#5b9dd9; --purple:#9b7fd4;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  line-height:1.75; padding:28px 20px 60px; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px;margin:0 auto}

/* ---------- header ---------- */
header{text-align:center;margin-bottom:24px}
h1{font-size:26px;font-weight:600;letter-spacing:.5px}
h1 .em{color:var(--gold)}
.sub{color:var(--tx3);font-size:13px;margin-top:6px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:600;line-height:1.2}
.stat span{font-size:11px;color:var(--tx3);letter-spacing:.5px}
.s-due b{color:var(--gold)} .s-new b{color:var(--blue)}
.s-ok b{color:var(--green)} .s-all b{color:var(--tx2)}

/* ---------- bar ---------- */
.progress{height:6px;background:var(--panel);border-radius:99px;overflow:hidden;margin-bottom:22px;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--green));width:0;transition:width .4s}

/* ---------- controls ---------- */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
select,.btn{
  background:var(--panel2);color:var(--tx);border:1px solid var(--line2);
  border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer;
  font-family:inherit;transition:.15s;
}
.btn:hover,select:hover{border-color:var(--gold);color:var(--gold)}
.btn.pri{background:var(--gold);color:#20180a;border-color:var(--gold);font-weight:600}
.btn.pri:hover{filter:brightness(1.1);color:#20180a}
.spacer{flex:1}

/* ---------- card ---------- */
.card{
  background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1px solid var(--line2); border-radius:20px;
  padding:30px 30px 26px; min-height:340px;
  display:flex;flex-direction:column; position:relative; overflow:hidden;
}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--gold),transparent)}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.tag{font-size:11px;padding:3px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--tx2);background:#0f131a}
.tag.dom{border-color:var(--gold);color:var(--gold)}
.tag.num{border-color:var(--blue);color:var(--blue)}
.tag.fab{border-color:var(--purple);color:var(--purple)}

.q{font-size:14px;color:var(--tx3);margin-bottom:10px;letter-spacing:.5px}
.title{font-size:23px;font-weight:600;line-height:1.5;margin-bottom:4px}
.hintbox{margin-top:20px;padding:14px 16px;border-left:3px solid var(--line2);
  background:#0e1218;border-radius:0 10px 10px 0;color:var(--tx2);font-size:13.5px}
.hintbox b{color:var(--gold);font-weight:600}

.answer{margin-top:20px;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.anchor{
  background:#141a14;border:1px solid #2c4034;border-left:3px solid var(--green);
  border-radius:0 12px 12px 0;padding:14px 18px;margin-bottom:16px;
  font-size:16px;color:#cfe7d8;font-weight:500;
}
.anchor small{display:block;color:var(--green);font-size:11px;margin-bottom:4px;letter-spacing:1px}
.summary{font-size:14.5px;color:var(--tx2);white-space:pre-wrap}
.rel{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.rel small{color:var(--tx3);font-size:11px;letter-spacing:1px}
.rel .chips{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:4px 10px;border-radius:8px;background:#161d28;border:1px solid var(--line);color:var(--tx2);cursor:pointer;transition:.15s;user-select:none}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{border-color:var(--blue);color:var(--blue);background:#12202e}
.chip::after{content:" ›";color:var(--tx3);font-size:11px}
.chip.on::after{content:" ⌄";color:var(--blue)}
.chip-desc{margin-top:10px;padding:11px 15px;background:#0e1520;border:1px solid var(--line2);
  border-left:3px solid var(--blue);border-radius:0 10px 10px 0;font-size:13px;color:var(--tx2);
  line-height:1.7;animation:fade .2s;display:none}
.chip-desc b{color:var(--blue);font-weight:600}
.chip-desc .cd-empty{color:var(--tx3)}
.cardfoot{margin-top:auto;padding-top:22px}

/* ---------- grade ---------- */
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g{padding:13px 8px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);
  cursor:pointer;text-align:center;transition:.15s}
.g:hover{transform:translateY(-2px)}
.g b{display:block;font-size:14px;font-weight:600}
.g span{font-size:10.5px;color:var(--tx3)}
.g1{border-color:#5a2c2c} .g1:hover{background:#2a1616} .g1 b{color:var(--red)}
.g2{border-color:#5a4a2c} .g2:hover{background:#2a2216} .g2 b{color:var(--gold)}
.g3{border-color:#2c5a3f} .g3:hover{background:#162a1f} .g3 b{color:var(--green)}
.showbtn{width:100%;padding:15px;border-radius:12px;border:1px dashed var(--line2);
  background:#0f131a;color:var(--tx2);cursor:pointer;font-size:14px;font-family:inherit;transition:.15s}
.showbtn:hover{border-color:var(--gold);color:var(--gold)}

/* ---------- done / empty ---------- */
.done{text-align:center;padding:60px 20px}
.done .ic{font-size:44px}
.done h2{font-size:20px;margin:14px 0 8px;color:var(--green)}
.done p{color:var(--tx3);font-size:13.5px}

/* ---------- list mode ---------- */
.list{display:none;margin-top:8px}
.grp{margin-bottom:20px}
.grph{font-size:13px;color:var(--gold);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:8px;letter-spacing:.5px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:6px;font-size:13px;display:flex;gap:10px;align-items:baseline}
.item .n{color:var(--tx3);font-size:11px;min-width:32px}
.item .t{flex:1;color:var(--tx)}
.item .st{font-size:10.5px;padding:2px 8px;border-radius:6px;white-space:nowrap}
.st-new{background:#16202c;color:var(--blue)} .st-due{background:#2a2216;color:var(--gold)} .st-ok{background:#16241c;color:var(--green)}

.kbd{font-size:11px;color:var(--tx3);text-align:center;margin-top:18px}
.kbd b{background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:1px 7px;color:var(--tx2);font-weight:500}
.kbd .mob{display:none}

/* ---------- 读后回顾 ---------- */
[hidden]{display:none!important}
button,input{font:inherit}
button{color:inherit}
button:disabled{opacity:.4;cursor:default;transform:none!important}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.switcher{display:flex;gap:6px;padding:5px;border:1px solid var(--line);border-radius:13px;background:var(--bg2);max-width:410px;margin:20px auto 8px}
.viewbtn{flex:1;border:0;border-radius:9px;padding:10px 16px;background:transparent;color:var(--tx2);cursor:pointer;font-size:14px}
.viewbtn[aria-pressed="true"]{background:var(--panel2);color:var(--gold);font-weight:600;box-shadow:0 1px 5px #0003}
.viewnote{text-align:center;font-size:12px;color:var(--tx2);margin-bottom:20px}
.searchbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.searchbox{flex:1;min-width:0;border:1px solid var(--line2);border-radius:10px;background:var(--bg2);color:var(--tx);padding:11px 14px;font-size:14px}
.searchbox::placeholder{color:var(--tx3)}
.resultbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;color:var(--tx2);font-size:12px;margin:0 2px 12px}
.section-label{font-size:11px;letter-spacing:1.5px;color:var(--gold);margin-bottom:10px}
.reading .title{margin-bottom:10px}
.reading .answer{margin-top:22px}
.reading .summary{font-size:16px;line-height:1.95;color:var(--tx);max-width:76ch;white-space:pre-wrap;overflow-wrap:anywhere}
.answer .anchor{margin-top:22px;margin-bottom:0;font-size:14px}
.navrow{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:18px}
.navrow .btn{min-width:100px}
.navrow .pos{font-size:12px;color:var(--tx3);text-align:center}
.readfoot{padding-top:20px;margin-top:24px;border-top:1px solid var(--line)}
.readfoot p{color:var(--tx3);font-size:12px;text-align:center}
.item{width:100%;font-family:inherit;text-align:left;cursor:pointer;transition:border-color .15s}
.item:hover,.item[aria-current="true"]{border-color:var(--gold);background:var(--panel2)}
.item .t{min-width:0;overflow-wrap:anywhere}
.chip{font-family:inherit;text-align:left}
.empty-note{padding:26px;color:var(--tx2);text-align:center}
@media(max-width:640px){
  .switcher{max-width:none;margin-top:16px}
  .viewnote{font-size:11px}
  .reading .summary{font-size:15px;line-height:1.9}
  .searchbar .btn{flex:0 0 auto}
  .navrow .btn{flex:0 1 auto;min-width:78px}
  .navrow .pos{font-size:11px}
}

/* ---------- 移动端 ---------- */
@media(max-width:640px){
  body{padding:16px 12px calc(30px + env(safe-area-inset-bottom))}
  header h1{font-size:21px}
  .sub{font-size:11.5px}
  .stats{grid-template-columns:repeat(4,1fr);gap:6px}
  .stat{padding:10px 4px;border-radius:11px}
  .stat b{font-size:18px}
  .stat span{font-size:9.5px;letter-spacing:0}
  .bar{gap:6px}
  select,.btn{padding:9px 11px;font-size:12.5px;flex:1 1 auto;text-align:center}
  #bStart{flex:1 1 100%;order:-1;padding:12px}
  .card{padding:20px 16px;border-radius:16px;min-height:0}
  .title{font-size:19px}
  .meta{margin-bottom:14px;gap:6px}
  .tag{font-size:10px;padding:2px 8px}
  .hintbox{font-size:13px;padding:12px 13px}
  .anchor{font-size:15px;padding:12px 14px}
  .summary{font-size:14px}
  .cardfoot{padding-top:18px}
  .grade{gap:7px}
  .g{padding:15px 4px}          /* 手机上加大点击区 */
  .g b{font-size:13.5px} .g span{font-size:9.5px}
  .showbtn{padding:17px}
  .kbd .pc{display:none}
  .kbd .mob{display:inline}
}
@media(max-width:380px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .title{font-size:17.5px}
}
</style>

<body>
<div class="wrap">

<header>
  <h1>知识<span class="em">复习台</span></h1>
  <div class="sub">读后回顾 · 概念摘要</div>
</header>

<div class="switcher" role="group" aria-label="选择复习方式">
  <button class="viewbtn" id="bRead" aria-pressed="true">读后回顾</button>
  <button class="viewbtn" id="bRecall" aria-pressed="false">回忆自测</button>
</div>
<p class="viewnote" id="viewNote">直接回看已有概念摘要；浏览不评分，也不改变复习进度。</p>
<div class="stats" aria-label="自测进度统计">
  <div class="stat s-due"><b id="sDue">0</b><span>到期待自测</span></div>
  <div class="stat s-new"><b id="sNew">0</b><span>尚未自测</span></div>
  <div class="stat s-ok"><b id="sOk">0</b><span>熟悉中</span></div>
  <div class="stat s-all"><b id="sAll">0</b><span>概念总数</span></div>
</div>
<div class="progress"><i id="pbar"></i></div>

<div class="searchbar" role="search">
  <input class="searchbox" id="search" type="search" placeholder="搜索概念、摘要或题号，如 MoE / #141" aria-label="搜索概念、摘要或题号" autocomplete="off">
  <button class="btn" id="bClear" hidden>清除</button>
</div>
<div class="bar">
  <select id="fDom" aria-label="选择领域"><option value="">全部领域</option></select>
  <select id="fOrder" aria-label="摘要浏览顺序">
    <option value="newest">题号从新到旧</option>
    <option value="oldest">题号从旧到新</option>
    <option value="title">按概念名称</option>
  </select>
  <select id="fMode" aria-label="自测方式" hidden>
    <option value="due">智能复习（到期优先）</option>
    <option value="all">全部轮一遍</option>
    <option value="weak">只练不熟的</option>
    <option value="rand">随机抽查</option>
  </select>
  <button class="btn pri" id="bStart" hidden>开始自测</button>
  <span class="spacer"></span>
  <button class="btn" id="bList" aria-expanded="false" aria-controls="list">概念目录</button>
  <button class="btn" id="bReset" hidden>重置自测进度</button>
</div>
<div class="resultbar"><span id="resultCount" role="status" aria-live="polite"></span><span id="orderNote">不含完整阅读正文</span></div>

<main id="stage" aria-label="概念内容"></main>

<div class="list" id="list"></div>

<div class="kbd">
  <span class="pc" id="keysPc"></span>
  <span class="mob" id="keysMob"></span>
</div>
<div class="sub" style="text-align:center;margin-top:12px">自测进度保存在当前浏览器；本地版、线上版及不同设备分别记录。</div>
</div>

  "emoji": "⚖️",
  "num": 9,
  "summary": "无罪推定（Presumption of Innocence）是现代法治的基石原则：任何人在被依法定罪之前，都应被视为无罪。 它包含三个连锁要点——① 举证责任在控方（原告/检察官），被告不必自证清白；② 证明标准极高（刑事案件需达到\"排除合理怀疑 / beyond reasonable doubt\"）；③ 疑罪从无，证据不足时判无罪，而非\"宁可错杀\"。这条原则用一句法谚概括就是布莱克斯通（William Blackstone）的名言：\"宁可放过十个真凶，也不错罚一个无辜（It is better that ten guilty persons escape than that one innocent suffer）\"。 它刻意让天平向被告倾斜，因为国家权力太强大，个人几乎无力对抗。",

 {
  "id": "concept-triangle-stability",
  "title": "三角形稳定性 / 三角剖分（Triangulation / Structural Rigidity）",
  "domain": "手工动手",
  "emoji": "🛠️",
  "num": 10,
  "summary": "三角形是唯一\"天生不会变形\"的多边形——只要三条边的长度定了，这个三角形的形状就被完全锁死，再也无法在不折断或不改变边长的情况下被压扁或推歪。这条几何铁律叫结构刚性（rigidity）。相比之下，四边形（正方形、矩形）即使四条边都固定，仍然能被轻松推成一个平行四边形——它是\"软\"的。工程上把\"给不稳的结构加一根斜杆、拆成一堆三角形\"的手法叫三角剖分（triangulation）。从埃菲尔铁塔、桥梁桁架、起重机吊臂，到自行车车架、屋顶人字梁、帐篷、甚至你晃动的木桌，\"加一根斜撑变成三角形\"几乎是所有加固问题的万能答案。它用最少的材料，换来最大的抗形变能力。",

  "summary": "杠杆原理是\"用一根硬棒 + 一个支点，把小力放大成大力\"的物理魔法——只要你离支点足够远，一根手指也能撬动巨石。核心是一条平衡等式：动力 × 动力臂 = 阻力 × 阻力臂。想省力，就让\"你用力的那端离支点远、被撬的重物离支点近\"。但天下没有免费的午餐：省了力，就得多走距离（你的手要压下很长一段，重物才升起一点点）——省力和省距离不可兼得，这叫功守恒。阿基米德那句\"给我一个支点，我能撬起整个地球\"说的就是它。从撬棍、剪刀、指甲钳、开瓶器、独轮车、钓鱼竿，到人的手臂关节、门把手，日常里到处是杠杆。它更是一个跨领域的\"放大器\"隐喻：金融杠杆用借来的钱放大收益（与风险）、媒体杠杆用一次发布触达百万人——本质都是找到那个\"支点\"，让有限的投入撬动远超自身的结果。",

 {

  "domain": "法学",
  "emoji": "⚖️",
  "num": 19,
  "summary": "程序正义（Procedural Justice）是与\"结果正义\"（分配正义 / Distributive Justice）相对的核心法治与公平原则：人们是否接受一个裁决，不仅取决于结果本身对不对、有没有利，更取决于\"得出结果的过程\"是否公正、透明、可参与、被平等对待。 甚至——程序足够公正时，人愿意接受一个对自己不利的结果。 一句流传极广的英美法谚概括了它：\"Justice must not only be done, but must also be seen to be done\"（正义不仅要实现，而且必须以看得见的方式实现）。 心理学家 Tom Tyler 的研究把它拆成四块可感知的要素：发言权（Voice）、中立（Neutrality）、尊重（Respect）、可信/善意（Trust）。它解释了一个反直觉现象：判得再\"准\"，若过程黑箱、不让人说话，人也不服；反之过程公开公正，输了也能心平气和走开。",

  "summary": "供需关系（Supply and Demand）是市场经济最底层的运行机制：任一商品的价格与成交量，由\"想买的力量\"（需求）和\"愿卖的力量\"（供给）共同拉扯决定，并总是向二者恰好相等的那一点（均衡）自发靠拢。 两条核心规律——需求定律（价越高、想买的越少）与供给定律（价越高、愿卖的越多）——像两只看不见的手把价格推向平衡点。任何打破平衡的冲击（歉收、流行、补贴、限价）都会让价格与产量重新调整，直到新的均衡出现。价格在这里不是\"标签\"，而是一套传递稀缺信息、协调千万陌生人行为的信号系统——这正是亚当·斯密\"看不见的手\"的机制内核。理解它，就理解了菜价为何涨、演唱会门票为何秒空、限价为何常常制造短缺。",

  "summary": "导数（Derivative）是微积分的核心概念，一句话说清：它是\"瞬间的变化率\"——在某一刻，某个量正在以多快的速度改变，方向是往上还是往下。 位置对时间求导得到速度，速度对时间求导得到加速度；成本对产量求导得到\"边际成本\"，收益对时间求导得到\"当下增速\"。几何上，导数就是曲线在某一点的切线斜率——把曲线放大到极致，任何光滑曲线在一个点附近看起来都像一条直线，那条直线的陡峭程度就是导数。它的思想内核是\"无限逼近\"：不去问\"这一段平均变了多少\"，而是把观察的时间窗口无限缩小，逼到一个瞬间，看那一刻的趋势。理解导数，就理解了物理里的速度加速度、经济里的边际与弹性、以及为什么\"增速放缓\"和\"总量下降\"是两码事——这是看清一切\"变化中的世界\"的透镜。",

  "emoji": "🧠",
  "num": 23,
  "summary": "稻草人谬误（Straw Man Fallacy）是一种歪曲对方观点、再攻击那个被歪曲版本的逻辑谬误。一句话说清：你不去反驳对手真正说的话，而是先把他的话夸大、简化或篡改成一个更荒谬、更好打的版本（\"稻草人\"），然后痛快地打倒它，制造出\"我已经驳倒你\"的假象。 就像战场上不去打真正的敌人，而是扎一个稻草做的假人，把它砍翻，再宣称自己赢了——真正的对手却毫发无损，还站在原地。它是日常辩论、社交媒体、政治宣传中最常见也最隐蔽的谬误之一：常以\"所以你的意思就是……\"\"照你这么说……\"开场，把一个温和、有限定的主张，替换成一个极端、无限定的主张。识别它的关键，是随时问一句：\"对方真的是这个意思吗？还是我在打一个我自己造出来的假人？\" 它的解药是\"善意原则（Principle of Charity）\"——先把对方观点复述到连对方都点头（#解药：善意原则与ITT），再开始反驳。",

  "domain": "人文思想",
  "emoji": "📜",
  "num": 24,
  "summary": "路径依赖（Path Dependence）指的是：一个系统当下的状态与选择，被它过去走过的路径牢牢锁住——历史一旦发生，就不再是可以随意翻篇的\"过去\"，而会持续决定\"现在能做什么\"。 一句话说清：\"我们今天这样做，往往不是因为它最好，而是因为当初碰巧这样开了头，后来就越走越难回头。\" 它最经典的例子是你正盯着的 QWERTY 键盘——这套字母排列当年是为了迁就打字机机械结构、故意把常用键岔开来防卡键，效率并非最优；可一旦无数人学会了它、无数厂商按它造键盘，\"换一套更快的排列\"的代价就大到没人愿意付，于是一个\"次优解\"被历史锁定到今天。路径依赖的核心机制是自我强化的正反馈（flywheel-effect 飞轮效应）与越来越高的转换成本：早期一点微小的、甚至偶然的优势，会被不断放大、锁死，形成\"锁定（Lock-in）\"。它提醒我们两件反直觉的事：① 现存的东西未必是最优的，只是\"先到的\"；② 历史有惯性，重大转向的窗口往往只在早期短暂开启。",

  "summary": "昼夜节律（Circadian Rhythm）指的是：生物体内存在一台\"自带的、大约以 24 小时为周期\"的生理时钟，它会自发地调节我们的睡眠—清醒、体温、激素、代谢等几乎一切生命活动的节奏——即使把你关进完全没有阳光、没有钟表的山洞里，这台钟也照走不误。 一句话说清：\"你想睡、想吃、有精神还是犯困，很大程度上不是当下临时决定的，而是体内一台走了几十亿年的老钟提前排好的班表。\" 关键有三点，都相当反直觉：① 这台钟是\"内源的\"（endogenous）——它不是被太阳\"推着走\"，而是自己会走，太阳只是每天帮它\"对表\"；② 它的天然周期其实略长于 24 小时（人类平均约 24.2 小时），所以每天都需要靠外界信号（主要是光）往前拨一点校准，否则会一天天往后漂移；③ 给它对表的外界信号叫\"授时因子\"（Zeitgeber，德语\"给时间的东西\"），其中光是最强的一个。这台主钟长在大脑下丘脑的视交叉上核（SCN），像乐队指挥，同步着全身各器官的\"外周时钟\"。理解它，就理解了倒时差、熬夜后的萎靡、周末补觉却更困、褪黑素、以及\"为什么睡前别刷手机\"背后的同一套机制。",

  "summary": "罪刑法定原则（Principle of Legality）是现代刑法的第一块基石，一句拉丁法谚概括：\"Nullum crimen, nulla poena sine lege\"——法无明文规定不为罪，法无明文规定不处罚。 意思是：一个行为要被当作犯罪、要被施加刑罚，必须在行为发生之前，就已经由成文法律白纸黑字地、清楚地规定好。 它由四条子规则支撑（经典表述常追溯至德国刑法学家 Feuerbach）：① 成文（lex scripta）——定罪依据必须是明文法律，不能靠习惯或法官临时发明；② 明确（lex certa）——法条要写得清楚具体，让普通人能预知什么违法；③ 禁止溯及既往（lex praevia）——不能拿今天新立的法去追罚昨天的旧行为；④ 禁止类推（lex stricta）——不能因为某行为\"和某条罪差不多\"就硬套上去定罪。它的根本目的只有一个：把国家的刑罚权关进法律的笼子，防止官府或法官凭一时好恶、事后任意地给人定罪。 我国《刑法》第 3 条即确立了这一原则。",

  "summary": "摩擦力是两个接触面之间\"互相拽住、阻止相对滑动\"的力——它是你走路不摔、拧螺丝不打滑、刹车能停下的幕后功臣，也是拖箱子累、机器发热磨损的元凶。它有两副面孔：静摩擦（东西还没动时，你越推它越顶回来，直到你推过一个\"最大值\"它才肯松口）和动摩擦（东西一旦滑起来，阻力反而略微变小、大致恒定）。这就解释了一个人人都有的体感——\"推一个重箱子，最难的是让它'开始'动的那一下；一旦滑起来反而轻松了。\" 摩擦力大小主要取决于两点：压得多紧（正压力）和两个面有多\"涩\"（摩擦系数），而跟接触面积大小几乎无关（这点最反直觉）。它是一把双刃剑：该有的地方（鞋底、轮胎、螺纹、皮带）拼命增大它，不该有的地方（轴承、活塞、滑轨）拼命减小它。更是一个绝佳的跨领域隐喻——任何系统\"由静到动\"都有一道要跨过的坎（创业启动、习惯养成、拖延症的\"开始最难\"），而经济学里的\"交易摩擦成本\"、社会学里的\"制度摩擦\"，讲的都是同一件事：阻碍相对运动、让理想状态打折扣的那股看不见的阻力。",

  "summary": "二阶思维（Second-Order Thinking）是一种不止步于\"直接结果\"、继续追问\"然后呢？再然后呢？\"的思考方式。一句话说清：大多数人做决定只看第一步会发生什么（一阶结果）；而二阶思维的人会追问——这一步之后，别人会怎么反应、系统会怎么调整、时间拉长后会引出什么连锁后果（二阶、三阶结果）。 很多看起来\"明显是好\"的决定，一阶是甜的、二阶却是苦的：降价能立刻多卖货（一阶好），但会引来价格战、拉低整个行业利润（二阶坏）；加薪能立刻留住人（一阶好），但可能引发全员攀比、成本失控（二阶坏）。它的经典口诀来自投资家 Howard Marks：\"And then what?（然后呢？）\"——每做一个判断，都把这句话再问三遍。它是区分\"聪明的决定\"和\"看起来聪明、其实埋雷的决定\"的分水岭；也是识破那些\"人人都能想到、所以早已被算进价格里\"的浅层机会的关键（一阶显而易见的机会，往往已无超额回报）。",

  "summary": "斯多葛主义（Stoicism） 的核心操作系统是控制二分法（The Dichotomy of Control）：把世上的一切干净利落地分成两堆——\"由我做主的\"（up to us） 和 \"不由我做主的\"（not up to us）。前者只有我们的判断、意图、选择、态度；后者几乎是其余一切——他人评价、身体健康、财富、天气、结果成败、乃至我们的名声。痛苦几乎全部来自：把力气和情绪押在了第二堆上。 斯多葛的解法不是\"看破放下什么都不管\"，而是把全部精力投向能控制的那一堆、对不能控制的那一堆保持平静接纳——尽人事，然后坦然接住任何结果。这与中式的\"尽人事听天命\"（见 chinese-philosophy-calm）殊途同归，构成一副东西方共享的\"平心药\"。",

  "emoji": "⚖️",
  "num": 38,
  "summary": "举证责任（Burden of Proof，拉丁谚 Ei incumbit probatio qui dicit, non qui negat——\"证明的责任落在主张的一方，而非否认的一方\"）回答一个看似简单却极关键的问题：当双方各执一词、真相不明时，究竟该由谁拿出证据？拿不出证据的后果由谁承担？ 核心答案是\"谁主张，谁举证\"（onus probandi）：提出一个论断（尤其是\"某事发生了 / 某人做了\"这类肯定性主张）的一方，负有拿出证据支撑它的责任；对方默认不必自证清白。它含两层：① 说服责任（burden of persuasion）——最终要把法官/听众说服到某个\"证明标准\"（刑事\"排除合理怀疑\"、民事\"优势证据\"）；② 提证责任（burden of production）——先拿出足够证据让争点能被审理，达不到直接败诉。它的孪生逻辑规则是：\"举证责任在主张方\"意味着——你无法证明某事不存在，并不等于它就存在（否认者不承担\"证明它不存在\"的负担，这正是\"诉诸无知\"谬误的解药）。刑事诉讼里，举证责任几乎全压在控方，正是 presumption-of-innocence 无罪推定的直接推论。",

  "num": 39,
  "summary": "公差（Tolerance）是\"允许的误差范围\"，配合（Fit）是\"两个零件装到一起后留多大间隙或压多紧\"。 核心洞见只有一句：世界上不存在\"绝对精确\"的尺寸——任何加工出来的东西都有误差，工程师的本事不是\"做到分毫不差\"（做不到，也太贵），而是提前规定一个\"差到什么程度还能用\"的范围。图纸上一根轴写 Ø20，真正的写法其实是 Ø20 ⁺⁰·⁰⁰⁰ / ₋₀.₀₂₁——意思是\"做成 19.979～20.000 之间我都收货\"。这个上下限之间的宽度就是公差带。当两个零件要装配时，它们各自公差带的相对位置，决定了三种配合：间隙配合（轴比孔小，能自由转/滑，如车轮和车轴）、过盈配合（轴比孔还大，硬压进去靠\"挤\"锁死，如火车车轮压上轮轴）、过渡配合（可紧可松，介于两者之间）。间隙留多少，直接决定这台机器是灵活好用、卡死报废，还是松垮晃荡。 更妙的是它是一个绝佳的跨领域隐喻：管理里给下属留的\"容错空间\"、系统设计里的\"冗余余量\"、投资里的\"安全边际\"、人际关系里的\"边界感\"，本质都是同一件事——在\"太紧会崩、太松会垮\"之间，故意留一条恰到好处的缝。",

  "summary": "诚实信用原则（Principle of Good Faith，源自罗马法 *bona fides*）是民法领域至高无上的一条帝王条款（拉丁 *Treu und Glauben* / 德国民法 §242）：民事主体在行使权利、履行义务的全过程中，都必须诚实、守信、善意，不能钻字面空子损人利己。 它管的不是\"你有没有违反白纸黑字的具体条款\"，而是\"你有没有违背当初大家默认的那份善意与信赖\"。之所以被称为 \"帝王条款\"（Königsparagraph），是因为它凌驾于其他具体规则之上：当某个行为在字面上\"完全合法\"、却明显违背公平与善意时，法官可以直接援引它来堵住漏洞、否定那种\"合法的耍赖\"。我国《民法典》第 7 条将其确立为基本原则。它派生出一整套具体义务——缔约过失、附随义务（通知/协助/保密）、情势变更、禁止权利滥用、禁反言（Estoppel）——本质上都是在说同一件事：契约的灵魂不是文字，是信赖。",

  "summary": "热膨胀（Thermal Expansion）＝物体的温度升高时，内部微观粒子振动加剧、平均间距变大，于是宏观上\"变长、变大\"；温度降低则反向收缩。 一句话记忆：\"热了要伸腿，冷了要缩脖\"——绝大多数固体、液体、气体都逃不掉这条规律。 关键不在\"会不会膨胀\"（会），而在膨胀多少：由材料的热膨胀系数（α）和温度变化量（ΔT）共同决定，ΔL ≈ L₀ · α · ΔT（原来越长、系数越大、温差越大，伸缩就越明显）。这个看似不起眼的物理现象，是无数工程细节背后的\"隐形导演\"：铁轨为什么要留缝、大桥为什么要装伸缩缝、玻璃杯为什么倒开水会炸、水泥路面为什么要切一道道槽、体温计/老式温度计为什么能测温、暖气管为什么要拐个\"Ω\"形的弯——全是它。更妙的是，它和tolerance-fit公差配合血脉相连：木匠给抽屉留缝防梅雨卡死、工程师给铁轨留缝防夏天顶弯，本质是同一件事的两个版本——都是\"承认东西会随环境变化、于是故意预留一道恰到好处的余量去接纳它\"。跨领域看，它是\"给不可控的变化预留伸缩空间\"这一智慧最硬核的物理教材。",

  "summary": "勒夏特列原理（Le Chatelier's Principle）：如果对一个处于化学平衡的体系施加某种改变（增大或减小某物质的浓度、改变压强、改变温度），平衡就会向着能够\"削弱这个改变\"的方向移动，直到建立起新的平衡。 一句话记忆：\"你往哪边使劲逼它，它就往那边的反方向让一让，把你逼的那份变化卸掉一大半。\" 三条要点：① 它管的是动态平衡——正、逆两个方向仍在同时进行，只是速率相等、宏观上看着\"不动\"（看着静止，其实来来回回）；② 系统的反应永远是\"对着干、往回顶\"（负反馈/自我纠偏），而不是顺着你放大（那是正反馈）；③ 它只能部分抵消那份改变，绝不会完全恢复原样、也不会矫枉过正。这条 1884 年由法国化学家 Le Chatelier 提出的原理，不仅是合成氨（养活几十亿人的化肥）、制硫酸等工业调控产率的总开关，更是一把跨领域的\"自我纠偏透镜\"：市场供需的自动出清、身体体温与酸碱的稳态调节、投资组合的动态再平衡，本质上都是同一句话——\"系统被推离平衡，就自动往回拉一把\"。",

  "num": 56,
  "summary": "比例原则（Principle of Proportionality）是公法（宪法/行政法）领域约束公权力的一条帝王条款：国家为了一个正当目的去限制公民的权利时，所用的手段必须与目的\"成比例\"，不能\"用大炮打蚊子\"。 通俗讲就是\"杀鸡不用牛刀\"——为了达成 100 分的目的，不能给公民造成 1000 分的损害。它把一个模糊的\"过分不过分\"翻译成一套可操作的三阶（德国传统为三阶，加\"目的正当性\"前提则为四阶）审查：① 适当性（手段管不管用？能不能达成目的）→ ② 必要性（有没有更温和、伤害更小、同样有效的替代手段？必须选最小侵害的那个，\"能罚款就别关人\"）→ ③ 均衡性 / 狭义比例（就算手段有效又最温和，它带来的好处，值不值得付出的代价？两头上秤称一称）。三关全过才算合比例，任何一关不过，这个限权手段就违法/违宪。它管的不是\"你有没有权力做\"，而是\"你做得过不过分\"——是现代法治给公权力装的一把\"别用力过猛\"的卡尺。",

  "emoji": "🛠️",
  "num": 57,
  "summary": "应力集中（Stress Concentration）＝当一个受力的物体上出现\"形状的突然变化\"（尖角、缺口、孔洞、划痕、截面骤变）时，力线在这里被迫急转弯、拥挤到一起，导致这一小块局部的应力远高于平均应力——有时是几倍甚至十几倍。 一句话记忆：\"力怕拐急弯——凡是尖角、缺口、小孔，应力都会在那里堵成一团，裂缝就从那里裂开。\" 衡量它挤得多凶的指标叫应力集中系数 Kt＝局部峰值应力 ÷ 平均应力（尖角越尖、孔越小越突兀，Kt 越大）。这解释了一大堆\"看起来结实却偏偏从某处裂开\"的现象：撕不动的塑料包装，只要剪一个小口子就一撕就开（剪口＝人造应力集中）；玻璃切割先划一道浅痕再轻轻一掰就沿痕断开；衣服总从有破洞、有线头的地方继续撕大；飞机舷窗、手机边角、门框拐角都做成圆弧而非直角。工程上的两大解药都朴素得惊人：①把尖角改成圆角（过渡圆滑，让力线缓缓拐弯）；②在已有裂缝的最前端钻一个小圆孔（止裂孔 stop-drill），把\"极尖的裂缝尖端\"变成\"圆润的孔壁\"，降下 Kt、把裂缝按住。跨领域看，它是\"系统总在最尖锐的薄弱点、最突兀的过渡处率先崩溃\"这一规律的力学教科书——无论是一块钢板、一个团队、还是一份满仓的账户。",

const KEY = "wikiReview.v1";

/* ---------- 进度存储 ---------- */
let db = {};
try{
  const stored = JSON.parse(localStorage.getItem(KEY)||"{}");
  if(stored && typeof stored==="object" && !Array.isArray(stored)) db=stored;
}catch(e){ db={}; }
const save = ()=>{
  try{localStorage.setItem(KEY,JSON.stringify(db));}
  catch(e){ document.getElementById("viewNote").textContent="当前浏览器无法保存进度，本次评分仅在当前页面有效。"; }
};
const today = ()=> Math.floor(Date.now()/864e5);

function rec(id){
  if(!db[id]) db[id] = {rep:0, itv:0, due:0, seen:0};
  return db[id];
}
/* SM-2 简化：忘了→明天再来；模糊→间隔小涨；记得→间隔翻倍 */
const STEP = [1,2,4,7,15,30,60,120];
function gradeCard(id, g){
  const r = rec(id);
  r.seen++;
  if(g===1){ r.rep = 0; r.itv = 1; }
  else if(g===2){ r.rep = Math.max(0, r.rep); r.itv = STEP[Math.min(r.rep, STEP.length-1)]; r.rep++; }
  else { r.rep++; r.itv = STEP[Math.min(r.rep, STEP.length-1)]; }
  r.last = g;
  r.due = today() + r.itv;
  save();
}
const isNew  = id => !db[id] || !db[id].seen;
const isDue  = id => !isNew(id) && db[id].due <= today();
const isOk   = id => !isNew(id) && db[id].rep >= 3 && db[id].due > today();
const isWeak = id => !isNew(id) && (db[id].last===1 || db[id].rep<2);

/* ---------- 统计 ---------- */
function stats(){
  const pool = CARDS;
  const nDue = pool.filter(c=>isDue(c.id)).length;
  const nNew = pool.filter(c=>isNew(c.id)).length;
  const nOk  = pool.filter(c=>isOk(c.id)).length;
  document.getElementById("sDue").textContent = nDue;
  document.getElementById("sNew").textContent = nNew;
  document.getElementById("sOk").textContent  = nOk;
  document.getElementById("sAll").textContent = pool.length;
  const touched = pool.length - nNew;
  document.getElementById("pbar").style.width = (pool.length? touched/pool.length*100:0)+"%";
}

/* ---------- 队列 ---------- */
let queue = [], qi = 0, shown = false, view = "read";
const graded = new Set();
const $ = id => document.getElementById(id);
const shuffle = a =>{ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
function filteredPool(){
  const domain = $("fDom").value;
  const query = $("search").value.trim().toLocaleLowerCase();
  const number = query.match(/^(?:#|第\s*)(\d+)\s*题?$/);
  return CARDS.filter(c=>{
    if(domain && c.domain!==domain) return false;
    if(!query) return true;
    if(number) return c.num===Number(number[1]);
    return [c.title,c.summary,c.anchor,c.domain,...(c.tags||[]),c.num==null?"":String(c.num)]
      .join(" ").toLocaleLowerCase().includes(query);
  });
}
function orderedPool(){
  const order = $("fOrder").value;
  return filteredPool().sort((a,b)=>{
    if(order==="title") return a.title.localeCompare(b.title,"zh-CN");
    if(a.num==null && b.num!=null) return 1;
    if(a.num!=null && b.num==null) return -1;
    return (order==="oldest" ? (a.num||0)-(b.num||0) : (b.num||0)-(a.num||0))
      || a.title.localeCompare(b.title,"zh-CN");
  });
}
function syncView(){
  const reading = view==="read";
  $("bRead").setAttribute("aria-pressed",String(reading));
  $("bRecall").setAttribute("aria-pressed",String(!reading));
  $("fOrder").hidden=!reading;
  ["fMode","bStart","bReset"].forEach(id=>$(id).hidden=reading);
  $("viewNote").textContent=reading
    ? "直接回看已有概念摘要；浏览不评分，也不改变复习进度。"
    : "先尝试自己说清，再展开摘要对照；只有主动评分才会更新间隔。";
  $("orderNote").textContent=reading ? "不含完整阅读正文" : "进度只在当前浏览器保存";
  $("keysPc").innerHTML=reading
    ? "快捷键 &nbsp;<b>←</b> 上一条 &nbsp;<b>→ / N</b> 下一条"
    : "快捷键 &nbsp;<b>空格</b> 展开摘要 &nbsp;<b>1</b> 忘了 &nbsp;<b>2</b> 模糊 &nbsp;<b>3</b> 记得 &nbsp;<b>N</b> 跳过";
  $("keysMob").textContent=reading ? "左右滑动切换摘要，也可使用上一条 / 下一条按钮。"
    : "点卡片空白处展开摘要；滑动仅切换，不会自动评分。";
}
function setView(next){
  if(view===next) return;
  view=next;
  syncView();
  build();
}
function navigate(delta){
  if(!queue.length) return;
  const next=qi+delta;
  if(next<0 || next>queue.length || next===qi) return;
  qi=next; shown=false;
  render();
}
function updateResults(){
  const count=filteredPool().length;
  $("resultCount").textContent=`匹配 ${count} / ${CARDS.length} 个概念`+(view==="recall"?` · 本轮 ${queue.length} 张`:"");
  $("bClear").hidden=!$("search").value;
  if($("list").style.display==="block") renderList();
}

function build(){
  const mode=$("fMode").value;
  const pool=filteredPool();
  if(view==="read"){
    queue=orderedPool();
  }else if(mode==="due"){
    const due=pool.filter(c=>isDue(c.id));
    const nw=pool.filter(c=>isNew(c.id));
    queue=due.concat(shuffle(nw).slice(0,Math.max(8,due.length?4:12)));
    if(!queue.length) queue=shuffle(pool.slice());
  }else if(mode==="weak"){
    queue=pool.filter(c=>isWeak(c.id) || isNew(c.id));
    if(!queue.length) queue=shuffle(pool.slice());
  }else if(mode==="rand"){
    queue=shuffle(pool.slice()).slice(0,15);
  }else{
    queue=shuffle(pool.slice());
  }
  qi=0; shown=false; graded.clear();
  render();
}

/* ---------- 渲染 ---------- */
const esc = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const pretty = id => id.replace(/^concept-|^method-/,"").replace(/-/g," ");

function render(){
  const st=$("stage");
  const reading=view==="read";
  stats();
  updateResults();
  if(!queue.length){
    shown=false;
    st.innerHTML=`<div class="card"><div class="done"><h2>没有匹配的概念</h2>
      <p>换个关键词，或清除搜索与领域筛选。<br>现有摘要和自测进度都不会被删除。</p>
      <button class="btn" id="bFilters" style="margin-top:20px">清除筛选</button></div></div>`;
    $("bFilters").onclick=()=>{$("search").value="";$("fDom").value="";build();};
    return;
  }
  if(qi>=queue.length){
    shown=false;
    st.innerHTML=`<div class="card"><div class="done"><h2>${reading?"已浏览到这一组的末尾":"这一轮自测已结束"}</h2>
      <p>${reading?`这组共有 ${queue.length} 条概念摘要。浏览不会改变自测进度。`
        :`本轮 ${queue.length} 张卡，已主动评分 ${graded.size} 张；未评分的卡不改变间隔。`}</p>
      <div class="navrow"><button class="btn" id="bBack">返回上一条</button>
      <button class="btn pri" id="bAgain">${reading?"从头浏览":"再来一轮"}</button></div></div></div>`;
    $("bBack").onclick=()=>navigate(-1);
    $("bAgain").onclick=build;
    return;
  }
  const c=queue[qi], r=db[c.id];
  const state=isNew(c.id)?"尚未自测":`自测 ${r.seen} 次 · 间隔 ${r.itv} 天`;
  const hint=c.fable?`试着回想《<b>${esc(c.fable)}</b>》中的关键转折。`
    :"先试着说清它的核心意思，再想一个适用情境或容易误用的地方。";
  st.innerHTML=`<article class="card${reading?" reading":""}">
    <div class="meta">
      <span class="tag dom">${esc(c.emoji)} ${esc(c.domain)}</span>
      ${c.num?`<span class="tag num">每日一题 #${c.num}</span>`:""}
      <span class="tag">${esc(state)}</span><span class="spacer"></span>
      <span class="tag">${qi+1} / ${queue.length}</span>
    </div>
    <div class="q">${reading?"读后回顾 · 把刚读过的内容收拢成一个清楚的概念":"不看摘要，你能用自己的话讲清楚吗？"}</div>
    <h2 class="title">${esc(c.title)}</h2>
    ${reading?"":`<div class="hintbox">${hint}</div>`}
    <div id="ans"></div><div class="cardfoot${reading?" readfoot":""}" id="foot"></div>
  </article>`;
  if(reading || shown){
    reveal();
  }else{
    $("foot").innerHTML=`<button class="showbtn" id="bShow">想好了，展开概念摘要（空格）</button>`+navigationHTML();
    $("bShow").onclick=reveal;
    bindNavigation();
  }
}
function navigationHTML(){
  const reading=view==="read";
  return `<div class="navrow">
    <button class="btn" id="bPrev" ${qi===0?"disabled":""}>上一条</button>
    <span class="pos">${qi+1} / ${queue.length}${reading?"":" · 切换不评分"}</span>
    <button class="btn" id="bNext">${qi===queue.length-1?"结束本轮":reading?"下一条":"跳过"}</button>
  </div>`;
}
function bindNavigation(){
  $("bPrev").onclick=()=>navigate(-1);
  $("bNext").onclick=()=>navigate(1);
}

function reveal(){
  const c=queue[qi], a=$("ans");
  if(!c || !a) return;
  shown=true;
  a.innerHTML=`<div class="answer">
    <div class="section-label">概念摘要</div>
    <div class="summary">${esc(c.summary)}</div>
    ${c.anchor?`<div class="anchor"><small>记忆锚点</small>${esc(c.anchor)}</div>`:""}
    ${c.related && c.related.length?`<div class="rel"><small>关联概念 · 点击查看已有简介</small>
      <div class="chips">${c.related.map((r,i)=>`<button class="chip" data-i="${i}" aria-expanded="false" aria-controls="chipDesc">${esc(relName(r))}</button>`).join("")}</div>
      <div class="chip-desc" id="chipDesc" role="status"></div></div>`:""}
  </div>`;
  document.querySelectorAll(".rel .chip").forEach(el=>{
    el.onclick=ev=>{ev.stopPropagation();toggleChip(el);};
  });
  const reading=view==="read";
  $("foot").innerHTML=(reading?"<p>回看摘要，不等于完成自测；需要检验记忆时，可切换至回忆自测。</p>"
    :`<div class="grade">
      <button class="g g1" data-g="1"><b>忘了</b><span>明天再来</span></button>
      <button class="g g2" data-g="2"><b>模糊</b><span>短间隔</span></button>
      <button class="g g3" data-g="3"><b>记得</b><span>拉长间隔</span></button>
    </div>`)+navigationHTML();
  document.querySelectorAll(".g").forEach(el=>el.onclick=()=>doGrade(+el.dataset.g));
  bindNavigation();
}

/* 关联概念：兼容旧版纯 slug 字符串与新版 {id,name,blurb} 对象 */
const relName  = r => typeof r==="string" ? pretty(r) : (r.name || pretty(r.id));
const relBlurb = r => typeof r==="string" ? "" : (r.blurb || "");
function toggleChip(el){
  const c = queue[qi];
  const r = c.related[+el.dataset.i];
  const box = document.getElementById("chipDesc");
  const already = el.classList.contains("on");
  document.querySelectorAll(".rel .chip").forEach(x=>{x.classList.remove("on");x.setAttribute("aria-expanded","false");});
  if(already){ box.style.display="none"; return; }
  el.classList.add("on");
  el.setAttribute("aria-expanded","true");
  const bl = relBlurb(r);
  box.innerHTML = `<b>${esc(relName(r))}</b> ${bl?"— "+esc(bl):"<span class='cd-empty'>（这条暂无简介，可在 wiki 里查看详情）</span>"}`;
  box.style.display="block";
}

function doGrade(g){
  if(view!=="recall" || !shown || qi>=queue.length || ![1,2,3].includes(g)) return;
  gradeCard(queue[qi].id,g);
  graded.add(queue[qi].id);
  qi++; shown=false;
  render();
}

/* ---------- 清单模式 ---------- */
function renderList(){
  const el=$("list"), groups={};
  orderedPool().forEach(c=>(groups[c.domain]=groups[c.domain]||[]).push(c));
  let h="";
  Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length).forEach(d=>{
    const arr=groups[d];
    h+=`<div class="grp"><div class="grph">${esc(arr[0].emoji)} ${esc(d)} · ${arr.length} 条</div>`;
    arr.forEach(c=>{
      const s=isNew(c.id)?["st-new","尚未自测"]:isDue(c.id)?["st-due","到期"]:["st-ok",`间隔 ${db[c.id].itv} 天`];
      h+=`<button class="item" data-id="${esc(c.id)}" aria-current="${queue[qi]?.id===c.id}">
        <span class="n">${c.num?"#"+c.num:"—"}</span><span class="t">${esc(c.title)}</span>
        <span class="st ${s[0]}">${s[1]}</span></button>`;
    });
    h+="</div>";
  });
  el.innerHTML=h || '<div class="empty-note">当前筛选下没有概念。</div>';
  el.querySelectorAll(".item").forEach(button=>button.onclick=()=>{
    queue=orderedPool();
    qi=queue.findIndex(c=>c.id===button.dataset.id);
    if(qi<0) return;
    if(view==="recall") $("fMode").value="all";
    shown=false; graded.clear(); render();
    $("stage").scrollIntoView({behavior:"smooth",block:"start"});
  });
}

/* ---------- 初始化 ---------- */
(function init(){
  const doms = [...new Set(CARDS.map(c=>c.domain))];
  const sel = document.getElementById("fDom");
  doms.forEach(d=>{
    const n = CARDS.filter(c=>c.domain===d).length;
    const o = document.createElement("option");
    o.value = d; o.textContent = `${CARDS.find(c=>c.domain===d).emoji} ${d}（${n}）`;
    sel.appendChild(o);
  });
  $("bRead").onclick=()=>setView("read");
  $("bRecall").onclick=()=>setView("recall");
  $("bStart").onclick=build;
  $("fDom").onchange=build;
  $("fMode").onchange=build;
  $("fOrder").onchange=build;
  $("search").addEventListener("input",build);
  $("bClear").onclick=()=>{$("search").value="";build();$("search").focus();};
  document.getElementById("bList").onclick = ()=>{
    const el = document.getElementById("list");
    const on = el.style.display==="block";
    el.style.display = on?"none":"block";
    $("bList").setAttribute("aria-expanded",String(!on));
    $("bList").textContent=on?"概念目录":"收起目录";
    if(!on) renderList();
  };
  document.getElementById("bReset").onclick = ()=>{
    if(confirm("清空所有复习进度？（卡片内容不受影响）")){
      db = {}; save(); build(); 
      if(document.getElementById("list").style.display==="block") renderList();
    }
  };
  document.addEventListener("keydown",e=>{
    if(e.repeat || e.ctrlKey || e.metaKey || e.altKey || e.target.isContentEditable
      || e.target.closest("input,textarea,select,button,a")) return;
    if(e.code==="Space" && view==="recall"){
      e.preventDefault(); if(!shown && qi<queue.length) reveal();
    }else if(view==="recall" && ["1","2","3"].includes(e.key) && shown){
      e.preventDefault(); doGrade(Number(e.key));
    }else if(e.key==="ArrowRight" || e.key.toLowerCase()==="n"){
      e.preventDefault(); navigate(1);
    }else if(e.key==="ArrowLeft"){
      e.preventDefault(); navigate(-1);
    }
  });

  /* ---------- 移动端手势：点卡片翻面 + 左右滑动切卡 ---------- */
  const stg = document.getElementById("stage");
  stg.addEventListener("click", e=>{
    // 点在按钮/评分块上时不拦截
    if(e.target.closest("button,a,input,select") || window.getSelection()?.toString()) return;
    if(view==="recall" && !shown && qi<queue.length) reveal();
  });

  let tx=0,ty=0,tt=0,swipeAllowed=false;
  stg.addEventListener("touchstart",e=>{
    swipeAllowed=e.touches.length===1 && !e.target.closest("button,a,input,select");
    const t=e.changedTouches[0]; tx=t.clientX;ty=t.clientY;tt=Date.now();
  },{passive:true});
  stg.addEventListener("touchend",e=>{
    if(!swipeAllowed) return;
    swipeAllowed=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-tx,dy=t.clientY-ty,dt=Date.now()-tt;
    if(dt>600 || Math.abs(dx)<50 || Math.abs(dy)>Math.abs(dx) || window.getSelection()?.toString()) return;
    navigate(dx<0?1:-1);
  },{passive:true});
  stg.addEventListener("touchcancel",()=>{swipeAllowed=false;},{passive:true});

  syncView();
  build();
})();
</script>
</body>
